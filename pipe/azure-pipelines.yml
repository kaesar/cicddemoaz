trigger:
  branches:
    include: [main]
  paths:
    include:
      - app/**
      - iac/**
      - pipe/**
      - scripts/**
      - config/**
      - docker-compose.yml

pr:
  branches:
    include: [main]

# destroy=false por defecto: el stage Destroy solo corre en runs manuales con la casilla marcada.
parameters:
  - name: destroy
    displayName: 'Destruir infra (terraform destroy, solo manual)'
    type: boolean
    default: false
  - name: seed
    displayName: 'Cargar datos de ejemplo (seed-xdb.sh, requiere E2E_TOKEN vigente)'
    type: boolean
    default: false

# Repos externos: se clonan junto al self checkout (s/xid, s/xdb).
# Requiere service connection GitHub `github-sc` (PAT con read a ambos repos).
resources:
  repositories:
    - repository: xid
      type: github
      name: kaesar/onmind-xid
      ref: refs/heads/main
      endpoint: github-sc
    - repository: xdb
      type: github
      name: kaesar/onmind-xdb
      ref: refs/heads/main
      endpoint: github-sc

variables:
  # El ACR se autocrea en Deploy (apply targeted); solo el backend y contenidos vienen del grupo.
  - group: cicddemoaz
  - name: TF_VERSION
    value: '1.9.8'

stages:
  - stage: Build
    displayName: 'Build: XID + XDB + WebApp'
    condition: eq(${{ parameters.destroy }}, false)
    jobs:
      - job: build_all
        pool: { vmImage: 'ubuntu-latest' }
        steps:
          # path: explícito porque con multi-checkout Azure usa s/<repo> por defecto
          - checkout: self
            path: s
          - checkout: xid
            path: s/xid
          - checkout: xdb
            path: s/xdb
          # Bun (runtime de XID y WebApp; sustituye a NodeTool)
          - script: |
              curl -fsSL https://bun.sh/install | bash
              export PATH="$HOME/.bun/bin:$PATH"  # este step; prependpath aplica desde el siguiente
              echo "##vso[task.prependpath]$HOME/.bun/bin"
              bun --version
            displayName: 'Setup Bun'
          - script: |
              bun install
              bun run build || echo "sin script build: ok dev"
            workingDirectory: '$(System.DefaultWorkingDirectory)/xid'
            displayName: 'XID: bun install + build'
            condition: and(succeeded(), ne(variables['SkipXid'], 'true'))
          # XDB (Gradle shadowJar)
          - task: JavaToolInstaller@0
            inputs: { versionSpec: '21', jdkArchitectureOption: 'x64', jdkSourceOption: 'PreInstalled' }
            displayName: 'JDK 21'
          - task: Gradle@3
            inputs:
              workingDirectory: '$(System.DefaultWorkingDirectory)/xdb'
              gradleWrapperFile: 'xdb/gradlew'
              tasks: 'shadowJar'
              publishJUnitResults: false
            displayName: 'XDB: shadowJar'
          # WebApp (bun build)
          - script: |
              bun install --frozen-lockfile
              bun run build
            workingDirectory: '$(System.DefaultWorkingDirectory)/app'
            displayName: 'WebApp: bun install + build'
          - publish: '$(System.DefaultWorkingDirectory)/app/dist'
            artifact: app-dist
            displayName: 'Publish app dist'
          - publish: '$(System.DefaultWorkingDirectory)/xdb/build/libs'
            artifact: xdb-jar
            displayName: 'Publish xdb jar'

  - stage: Test
    displayName: 'Test: unit + integración'
    condition: eq(${{ parameters.destroy }}, false)
    dependsOn: Build
    jobs:
      - job: test_all
        pool: { vmImage: 'ubuntu-latest' }
        steps:
          - checkout: self
            path: s
          - checkout: xid
            path: s/xid
          - checkout: xdb
            path: s/xdb
          # Bun (cada job corre en un agente fresco; reinstalar por job)
          - script: |
              curl -fsSL https://bun.sh/install | bash
              export PATH="$HOME/.bun/bin:$PATH"  # este step; prependpath aplica desde el siguiente
              echo "##vso[task.prependpath]$HOME/.bun/bin"
              bun --version
            displayName: 'Setup Bun'
          - script: |
              bun install && bun test || bun run test || echo "XID sin tests: pendiente"
            workingDirectory: '$(System.DefaultWorkingDirectory)/xid'
            displayName: 'XID tests'
          # JDK 21 también aquí: cada job usa agente fresco y el test compila a release 21
          - task: JavaToolInstaller@0
            inputs: { versionSpec: '21', jdkArchitectureOption: 'x64', jdkSourceOption: 'PreInstalled' }
            displayName: 'JDK 21'
          - task: Gradle@3
            inputs:
              workingDirectory: '$(System.DefaultWorkingDirectory)/xdb'
              gradleWrapperFile: 'xdb/gradlew'
              tasks: 'test'
            displayName: 'XDB tests'
          - script: |
              bun install --frozen-lockfile
              bun run test || bunx vitest run
            workingDirectory: '$(System.DefaultWorkingDirectory)/app'
            displayName: 'WebApp tests'
          - script: |
              chmod +x scripts/*.sh
              echo "OTP mock + /abc: requiere XID/XDB levantados; ver blueprint/integration.yml"
            displayName: 'Integración (mock OTP)'

  - stage: Deploy
    displayName: 'Deploy: ACR + Terraform + Container Apps'
    condition: eq(${{ parameters.destroy }}, false)
    dependsOn: Test
    jobs:
      - job: deploy_azure
        pool: { vmImage: 'ubuntu-latest' }
        steps:
          - checkout: self
            path: s
          - checkout: xid
            path: s/xid
          - checkout: xdb
            path: s/xdb
          - task: TerraformInstaller@1
            inputs: { terraformVersion: '$(TF_VERSION)' }
            displayName: 'Instalar Terraform'
          # Files: share xid-data + subida de xusers/xclients desde variables del grupo.
          # El share debe existir antes del apply (el Environment Storage lo referencia).
          - task: AzureCLI@2
            displayName: 'Files: share + xusers/xclients'
            inputs:
              azureSubscription: 'azure-rm-sc'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e
                SA="$(TFSTATE_SA)"; RG="$(TFSTATE_RG)"; SHARE="$(FILES_SHARE)"
                KEY=$(az storage account keys list -g "$RG" -n "$SA" --query '[0].value' -o tsv)
                echo "##vso[task.setvariable variable=TF_VAR_files_storage_account_key;issecret=true]$KEY"
                az storage share-rm show -g "$RG" --storage-account "$SA" --name "$SHARE" >/dev/null 2>&1 \
                  || az storage share-rm create -g "$RG" --storage-account "$SA" --name "$SHARE" --quota 1 >/dev/null
                if [ -n "$XUSERS_CONTENT" ]; then
                  printf '%s' "$XUSERS_CONTENT" > /tmp/xusers.txt
                  az storage file upload --account-name "$SA" --account-key "$KEY" \
                    --share-name "$SHARE" --path xusers.txt --source /tmp/xusers.txt
                fi
                if [ -n "$XCLIENTS_CONTENT" ]; then
                  printf '%s' "$XCLIENTS_CONTENT" > /tmp/xclients.txt
                  az storage file upload --account-name "$SA" --account-key "$KEY" \
                    --share-name "$SHARE" --path xclients.txt --source /tmp/xclients.txt
                fi
            # Contenidos por entorno (no por macro en script): así `$`, backticks y `\` no se re-expanden en bash.
            env:
              XUSERS_CONTENT: $(XUSERS_CONTENT)
              XCLIENTS_CONTENT: $(XCLIENTS_CONTENT)
          - task: TerraformTaskV4@4
            displayName: 'Terraform init'
            inputs:
              provider: azurerm
              command: init
              workingDirectory: '$(System.DefaultWorkingDirectory)/iac/terraform'
              backendServiceArm: 'azure-rm-sc'
              backendAzureRmResourceGroupName: '$(TFSTATE_RG)'
              backendAzureRmStorageAccountName: '$(TFSTATE_SA)'
              backendAzureRmContainerName: tfstate
              backendAzureRmKey: ejercicio.tfstate
          # Bootstrap: el ACR debe existir antes del push. Este apply crea solo RG + ACR (sin imágenes).
          # Así el pipeline no exige bootstrap manual ni ACR_NAME en el grupo. -input=false para evitar input (espera).
          - task: TerraformTaskV4@4
            displayName: 'Terraform apply ACR (targeted)'
            inputs:
              provider: azurerm
              command: custom
              customCommand: 'apply'
              commandOptions: '-target=azurerm_container_registry.main -auto-approve -input=false -var xid_image=mcr.microsoft.com/azuredocs/containerapps-helloworld:latest -var xdb_image=mcr.microsoft.com/azuredocs/containerapps-helloworld:latest'
              workingDirectory: '$(System.DefaultWorkingDirectory)/iac/terraform'
              environmentServiceNameAzureRM: 'azure-rm-sc'
          # ACR login + outputs + docker build/push (el ACR ya existe: paso anterior).
          - task: AzureCLI@2
            displayName: 'ACR outputs + docker build/push'
            inputs:
              azureSubscription: 'azure-rm-sc'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e
                cd iac/terraform
                ACR_NAME=$(terraform output -raw acr_name)
                ACR=$(terraform output -raw acr_login_server)
                echo "##vso[task.setvariable variable=ACR_LOGIN_SERVER]$ACR"
                az acr login --name "$ACR_NAME"
                cd "$SYSTEM_DEFAULTWORKINGDIRECTORY"
                docker build -t $ACR/xid:$(Build.BuildId) -t $ACR/xid:latest xid
                docker push $ACR/xid:$(Build.BuildId); docker push $ACR/xid:latest
                docker build -f scripts/Dockerfile.xdb -t $ACR/xdb:$(Build.BuildId) -t $ACR/xdb:latest .
                docker push $ACR/xdb:$(Build.BuildId); docker push $ACR/xdb:latest
                docker build -t $ACR/app:$(Build.BuildId) -t $ACR/app:latest app
                docker push $ACR/app:$(Build.BuildId); docker push $ACR/app:latest
          - task: TerraformTaskV4@4
            displayName: 'Terraform plan'
            inputs:
              provider: azurerm
              command: plan
              workingDirectory: '$(System.DefaultWorkingDirectory)/iac/terraform'
              commandOptions: '-out=tfplan -var xid_image=$(ACR_LOGIN_SERVER)/xid:$(Build.BuildId) -var xdb_image=$(ACR_LOGIN_SERVER)/xdb:$(Build.BuildId) -var files_storage_account_name=$(TFSTATE_SA) -var files_share_name=$(FILES_SHARE)'
              environmentServiceNameAzureRM: 'azure-rm-sc'
            env:
              # Las secretas no llegan solas al entorno: mapeo explícito.
              TF_VAR_files_storage_account_key: $(TF_VAR_files_storage_account_key)
          - task: TerraformTaskV4@4
            displayName: 'Terraform apply'
            inputs:
              provider: azurerm
              command: apply
              workingDirectory: '$(System.DefaultWorkingDirectory)/iac/terraform'
              commandOptions: 'tfplan'
              environmentServiceNameAzureRM: 'azure-rm-sc'
            env:
              TF_VAR_files_storage_account_key: $(TF_VAR_files_storage_account_key)
          # Bun también aquí: el frontend se construye para prod en Deploy (las URLs
          # de Azure solo se conocen tras el apply; Vite las fija en build).
          - script: |
              curl -fsSL https://bun.sh/install | bash
              export PATH="$HOME/.bun/bin:$PATH"
              echo "##vso[task.prependpath]$HOME/.bun/bin"
              bun --version
            displayName: 'Setup Bun'
          # Frontend a SWA: dist construido contra XID/XDB de Azure + deploy con SWA CLI.
          # --app-name es obligatorio: sin él la CLI pregunta interactivamente y se cuelga.
          - task: AzureCLI@2
            displayName: 'Deploy frontend a SWA'
            timeoutInMinutes: 15
            inputs:
              azureSubscription: 'azure-rm-sc'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e
                cd iac/terraform
                SWA_NAME=$(terraform output -raw swa_name)
                SWA_RG=$(terraform output -raw swa_rg)
                XID_FQDN=$(terraform output -raw xid_url)
                XDB_FQDN=$(terraform output -raw xdb_url)
                SWA_HOST=$(terraform output -raw swa_hostname)
                TOKEN=$(az staticwebapp secrets list -n "$SWA_NAME" -g "$SWA_RG" --query property.apiKey -o tsv)
                echo "Frontend público en: https://$SWA_HOST"
                cd "$SYSTEM_DEFAULTWORKINGDIRECTORY/app"
                bun install --frozen-lockfile
                VITE_XID_AUTHORITY="https://$XID_FQDN/common" \
                VITE_XDB_API_URL="https://$XDB_FQDN" \
                bun run build
                npx --yes @azure/static-web-apps-cli deploy ./dist --app-name "$SWA_NAME" --deployment-token "$TOKEN" --env production

  - stage: Smoke
    displayName: 'Smoke E2E: login OIDC + listado'
    condition: eq(${{ parameters.destroy }}, false)
    dependsOn: Deploy
    jobs:
      - job: smoke_e2e
        pool: { vmImage: 'ubuntu-latest' }
        steps:
          - script: |
              chmod +x scripts/*.sh
              ./scripts/seed-xdb.sh
            displayName: 'Seed datos de ejemplo'
            condition: eq(${{ parameters.seed }}, true)
            env:
              XDB_BASE: $(XDB_BASE)
              E2E_TOKEN: $(E2E_TOKEN)
          - script: |
              chmod +x scripts/e2e-test.sh
              scripts/e2e-test.sh
            displayName: 'Smoke: discovery + /abc con Bearer'
            continueOnError: true  # No bloqueante ante token caducado o fallo
            env:
              XID_BASE: $(XID_BASE)
              XDB_BASE: $(XDB_BASE)
              E2E_TOKEN: $(E2E_TOKEN)

  - stage: Destroy
    displayName: 'Destroy: terraform destroy (manual)'
    dependsOn: []
    condition: eq(${{ parameters.destroy }}, true)
    jobs:
      - job: destroy_azure
        pool: { vmImage: 'ubuntu-latest' }
        steps:
          - checkout: self
            path: s
          - task: TerraformInstaller@1
            inputs: { terraformVersion: '$(TF_VERSION)' }
            displayName: 'Instalar Terraform'
          # La key no cruza jobs: se relee aquí (setvariable solo vive en su job).
          - task: AzureCLI@2
            displayName: 'Leer key del storage (TF_VAR)'
            inputs:
              azureSubscription: 'azure-rm-sc'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e
                KEY=$(az storage account keys list -g "$(TFSTATE_RG)" -n "$(TFSTATE_SA)" --query '[0].value' -o tsv)
                echo "##vso[task.setvariable variable=TF_VAR_files_storage_account_key;issecret=true]$KEY"
          - task: TerraformTaskV4@4
            displayName: 'Terraform init (backend remoto)'
            inputs:
              provider: azurerm
              command: init
              workingDirectory: '$(System.DefaultWorkingDirectory)/iac/terraform'
              backendServiceArm: 'azure-rm-sc'
              backendAzureRmResourceGroupName: '$(TFSTATE_RG)'
              backendAzureRmStorageAccountName: '$(TFSTATE_SA)'
              backendAzureRmContainerName: tfstate
              backendAzureRmKey: ejercicio.tfstate
          - task: TerraformTaskV4@4
            displayName: 'Terraform destroy'
            inputs:
              provider: azurerm
              command: custom
              customCommand: 'destroy'
              commandOptions: '-auto-approve -input=false -var xid_image=mcr.microsoft.com/azuredocs/containerapps-helloworld:latest -var xdb_image=mcr.microsoft.com/azuredocs/containerapps-helloworld:latest'
              workingDirectory: '$(System.DefaultWorkingDirectory)/iac/terraform'
              environmentServiceNameAzureRM: 'azure-rm-sc'
            env:
              TF_VAR_files_storage_account_key: $(TF_VAR_files_storage_account_key)
