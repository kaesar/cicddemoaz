trigger:
  branches:
    include: [main]
  paths:
    include:
      - app/**
      - iac/**
      - pipe/**
      - scripts/**
      - config/**
      - docker-compose.yml

pr:
  branches:
    include: [main]

# Repos externos: se clonan junto al self checkout (s/xid, s/xdb).
# Requiere service connection GitHub `github-sc` (PAT con read a ambos repos).
resources:
  repositories:
    - repository: xid
      type: github
      name: kaesar/onmind-xid
      ref: refs/heads/main
      endpoint: github-sc
    - repository: xdb
      type: github
      name: kaesar/onmind-xdb
      ref: refs/heads/main
      endpoint: github-sc

variables:
  - group: cicddemoaz   # XID_TENANT, ACR_NAME, PREFIX, LOCATION, etc.
  - name: TF_VERSION
    value: '1.9.8'
  - name: ACR_NAME
    value: $[variables.ACR_NAME]    # o setear literal si no hay variable group

stages:
  - stage: Build
    displayName: 'Build: XID + XDB + WebApp'
    jobs:
      - job: build_all
        pool: { vmImage: 'ubuntu-latest' }
        steps:
          # path: explícito porque con multi-checkout Azure usa s/<repo> por defecto
          - checkout: self
            path: s
          - checkout: xid
            path: s/xid
          - checkout: xdb
            path: s/xdb
          # Bun (runtime de XID y WebApp; sustituye a NodeTool)
          - script: |
              curl -fsSL https://bun.sh/install | bash
              export PATH="$HOME/.bun/bin:$PATH"  # este step; prependpath aplica desde el siguiente
              echo "##vso[task.prependpath]$HOME/.bun/bin"
              bun --version
            displayName: 'Setup Bun'
          - script: |
              bun install
              bun run build || echo "sin script build: ok dev"
            workingDirectory: '$(System.DefaultWorkingDirectory)/xid'
            displayName: 'XID: bun install + build'
            condition: and(succeeded(), ne(variables['SkipXid'], 'true'))
          # XDB (Gradle shadowJar)
          - task: JavaToolInstaller@0
            inputs: { versionSpec: '21', jdkArchitectureOption: 'x64', jdkSourceOption: 'PreInstalled' }
            displayName: 'JDK 21'
          - task: Gradle@3
            inputs:
              workingDirectory: '$(System.DefaultWorkingDirectory)/xdb'
              gradleWrapperFile: 'xdb/gradlew'
              tasks: 'shadowJar'
              publishJUnitResults: false
            displayName: 'XDB: shadowJar'
          # WebApp (bun build)
          - script: |
              bun install --frozen-lockfile
              bun run build
            workingDirectory: '$(System.DefaultWorkingDirectory)/app'
            displayName: 'WebApp: bun install + build'
          - publish: '$(System.DefaultWorkingDirectory)/app/dist'
            artifact: app-dist
            displayName: 'Publish app dist'
          - publish: '$(System.DefaultWorkingDirectory)/xdb/build/libs'
            artifact: xdb-jar
            displayName: 'Publish xdb jar'

  - stage: Test
    displayName: 'Test: unit + integración'
    dependsOn: Build
    jobs:
      - job: test_all
        pool: { vmImage: 'ubuntu-latest' }
        steps:
          - checkout: self
            path: s
          - checkout: xid
            path: s/xid
          - checkout: xdb
            path: s/xdb
          # Bun (cada job corre en un agente fresco; reinstalar por job)
          - script: |
              curl -fsSL https://bun.sh/install | bash
              export PATH="$HOME/.bun/bin:$PATH"  # este step; prependpath aplica desde el siguiente
              echo "##vso[task.prependpath]$HOME/.bun/bin"
              bun --version
            displayName: 'Setup Bun'
          - script: |
              bun install && bun test || bun run test || echo "XID sin tests: pendiente"
            workingDirectory: '$(System.DefaultWorkingDirectory)/xid'
            displayName: 'XID tests'
          - task: Gradle@3
            inputs:
              workingDirectory: '$(System.DefaultWorkingDirectory)/xdb'
              gradleWrapperFile: 'xdb/gradlew'
              tasks: 'test'
            displayName: 'XDB tests'
          - script: |
              bun install --frozen-lockfile
              bun run test || bunx vitest run
            workingDirectory: '$(System.DefaultWorkingDirectory)/app'
            displayName: 'WebApp tests'
          - script: |
              chmod +x scripts/*.sh
              echo "OTP mock + /abc: requiere XID/XDB levantados; ver blueprint/integration.yml"
            displayName: 'Integración (mock OTP)'

  - stage: Deploy
    displayName: 'Deploy: ACR + Terraform + Container Apps'
    dependsOn: Test
    jobs:
      - job: deploy_azure
        pool: { vmImage: 'ubuntu-latest' }
        steps:
          - checkout: self
            path: s
          - checkout: xid
            path: s/xid
          - checkout: xdb
            path: s/xdb
          - task: AzureCLI@2
            displayName: 'ACR login + docker build/push XID XDB WebApp'
            inputs:
              azureSubscription: 'azure-rm-sc'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e
                ACR=$(az acr show -n $(ACR_NAME) --query loginServer -o tsv)
                az acr login -n $(ACR_NAME)
                docker build -t $ACR/xid:$(Build.BuildId) -t $ACR/xid:latest xid
                docker push $ACR/xid:$(Build.BuildId); docker push $ACR/xid:latest
                docker build -t $ACR/xdb:$(Build.BuildId) -t $ACR/xdb:latest xdb
                docker push $ACR/xdb:$(Build.BuildId); docker push $ACR/xdb:latest
                docker build -t $ACR/app:$(Build.BuildId) -t $ACR/app:latest app
                docker push $ACR/app:$(Build.BuildId); docker push $ACR/app:latest
          - task: TerraformInstaller@1
            inputs: { terraformVersion: '$(TF_VERSION)' }
            displayName: 'Instalar Terraform'
          - task: TerraformTaskV4@4
            displayName: 'Terraform init'
            inputs:
              provider: azurerm
              command: init
              workingDirectory: '$(System.DefaultWorkingDirectory)/iac/terraform'
              backendServiceArm: 'azure-rm-sc'
              backendAzureRmResourceGroupName: '$(TFSTATE_RG)'
              backendAzureRmStorageAccountName: '$(TFSTATE_SA)'
              backendAzureRmContainerName: tfstate
              backendAzureRmKey: ejercicio.tfstate
          - task: TerraformTaskV4@4
            displayName: 'Terraform plan'
            inputs:
              provider: azurerm
              command: plan
              workingDirectory: '$(System.DefaultWorkingDirectory)/iac/terraform'
              commandOptions: '-out=tfplan -var xid_image=$(ACR_LOGIN_SERVER)/xid:$(Build.BuildId) -var xdb_image=$(ACR_LOGIN_SERVER)/xdb:$(Build.BuildId)'
              environmentServiceNameAzureRM: 'azure-rm-sc'
          - task: TerraformTaskV4@4
            displayName: 'Terraform apply'
            inputs:
              provider: azurerm
              command: apply
              workingDirectory: '$(System.DefaultWorkingDirectory)/iac/terraform'
              commandOptions: 'tfplan'
              environmentServiceNameAzureRM: 'azure-rm-sc'

  - stage: Smoke
    displayName: 'Smoke E2E: login OIDC + listado'
    dependsOn: Deploy
    jobs:
      - job: smoke_e2e
        pool: { vmImage: 'ubuntu-latest' }
        steps:
          - script: |
              chmod +x scripts/e2e-test.sh
              scripts/e2e-test.sh
            displayName: 'Smoke: discovery + /abc con Bearer'
            env:
              XID_BASE: $(XID_BASE)
              XDB_BASE: $(XDB_BASE)
              E2E_TOKEN: $(E2E_TOKEN)
