# Template servidor (Azure) para XDB. Se bakea en la imagen (scripts/Dockerfile.xdb
# -> /app/onmind.ini, ver ONMIND_INI abajo) y Rote resuelve los os.environ/NAME
# en arranque (fail-fast si falta alguna env). Sin generadores ni heredocs.
# Env requeridas (las pone container-apps.tf; secretos por referencia a Key Vault):
#   XDB_OIDC_URL, XDB_OIDC_CLIENT_ID, XDB_CORS_ORIGINS, XDB_KV_STORE,
#   COSMOS_ENDPOINT, COSMOS_KEY, COSMOS_DATABASE, COSMOS_CONTAINER.
app.mode = production
app.local = /opt/onmind/run/
app.base = /app
app.language = en
app.logger = -
app.modality = 5
app.deploy = 0
app.ui = +
dai.port = 9990
app.cors = os.environ/XDB_CORS_ORIGINS
db.query_limit = 1200
db.export = -
file.enabled = -
mcp.enabled = -
grpc.enabled = -

auth.enabled = true
auth.type = ENTRAID
auth.oidc.url = os.environ/XDB_OIDC_URL
auth.oidc.client_id = os.environ/XDB_OIDC_CLIENT_ID

kv.store = os.environ/XDB_KV_STORE
kv.mvstore.name = xybox
kv.cosmosdb.endpoint = os.environ/COSMOS_ENDPOINT
kv.cosmosdb.key = os.environ/COSMOS_KEY
kv.cosmosdb.database = os.environ/COSMOS_DATABASE
kv.cosmosdb.container = os.environ/COSMOS_CONTAINER
