services:
  xid:
    # En local usar código de ../xid; en CI se sustituye por imagen ACR
    build:
      context: ../../../xid
      dockerfile: Dockerfile
    ports: ['8787:8787']
    env_file: ./config/xid.env.example
    environment:
      PORT: '8787'
      XID_TENANT: common
      XID_CORS_ORIGINS: http://localhost:3000
      XID_OTP_MOCK: 'true'
    volumes:
      - ../../../../xid/userbase.txt:/app/userbase.txt:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8787/health || wget -qO- http://localhost:8787/common/v2.0/.well-known/openid-configuration']
      interval: 10s
      retries: 10

  xdb:
    build:
      context: ../../../xdb
      dockerfile: Dockerfile
    ports: ['9990:9990']
    environment:
      XDB_AUTH_PROVIDER: oidc
      XDB_OIDC_ISSUER: http://xid:8787/common/v2.0
      XDB_OIDC_AUDIENCE: api://my-webapp
      XDB_OIDC_JWKS_URL: http://xid:8787/common/discovery/v2.0/keys
      KV_STORE: memory
    depends_on:
      xid:
        condition: service_started

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports: ['3000:80']
    environment:
      VITE_XID_AUTHORITY: http://localhost:8787/common
      VITE_XDB_API_URL: http://localhost:9990
    depends_on: [xid, xdb]

  # Emulador Cosmos para Fase 3 local (opcional):
  # cosmos:
  #   image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
  #   ports: ['8081:8081']
