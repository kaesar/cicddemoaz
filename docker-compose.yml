services:
  xid:
    # Código de ../xid (clonado como hermano de este repo); en CI se usa la imagen ACR
    build:
      context: ../xid
      dockerfile: Dockerfile
    ports: ['8787:8787']
    env_file: ./config/xid.env.example
    environment:
      PORT: '8787'
      XID_ENV: dev # dev: redirect abierto + OTP por consola si no hay SMTP
      XID_TENANT_ID: xid
      XID_CORS_ORIGINS: http://localhost:3000
      XID_REDIRECT_ALLOWLIST: http://localhost:3000/*
    volumes:
      - ../xid/xusers.txt:/app/xusers.txt:ro # crear con emails de prueba (ver README)
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8787/health || wget -qO- http://localhost:8787/common/v2.0/.well-known/openid-configuration']
      interval: 10s
      retries: 10

  xdb:
    build:
      context: ../xdb
      dockerfile: Dockerfile
    ports: ['9990:9990']
    # XDB solo lee onmind.ini (ignora variables de entorno).
    # Crear antes: cp config/onmind.ini.example config/onmind.ini
    volumes:
      - ./config/onmind.ini:/app/onmind.ini:ro
    depends_on:
      xid:
        condition: service_started

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports: ['3000:80']
    environment:
      VITE_XID_AUTHORITY: http://localhost:8787/common
      VITE_XDB_API_URL: http://localhost:9990
    depends_on: [xid, xdb]

  # Emulador Cosmos para Fase 3 local (opcional):
  # cosmos:
  #   image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
  #   ports: ['8081:8081']
